<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sueño Bacalar logo</title>
  <desc id="desc">Circular turquoise logo with a minimalist sunset over water and the text Sueño Bacalar.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#13B8B8"/>
      <stop offset="58%" stop-color="#079EAA"/>
      <stop offset="100%" stop-color="#047E8E"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#003B45" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="500" fill="url(#bg)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M337 369 A175 175 0 0 1 687 369"/>
    <line x1="250" y1="397" x2="774" y2="397"/>
    <line x1="315" y1="444" x2="709" y2="444"/>
    <line x1="402" y1="491" x2="622" y2="491"/>
  </g>

  <circle cx="746" cy="304" r="38" fill="#FFD77A"/>

  <text x="512" y="682" text-anchor="middle" fill="#FFFFFF"
        font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500"
        letter-spacing="18">SUEÑO</text>
  <text x="512" y="800" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="500"
        letter-spacing="36">BACALAR</text>
</svg>
