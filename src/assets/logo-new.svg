<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sueño Bacalar painted transparent logo</title>
  <desc id="desc">A transparent-background painted-style Sueño Bacalar logo with palms, yellow sunset arch, turquoise lagoon strokes, and light lettering.</desc>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#06383d" flood-opacity="0.18"/>
    </filter>
    <filter id="paintTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .yellow{fill:none;stroke:#F7B71E;stroke-linecap:round;stroke-linejoin:round;filter:url(#paintTexture)}
      .tealDark{fill:none;stroke:#057276;stroke-linecap:round;stroke-linejoin:round;filter:url(#paintTexture)}
      .teal{fill:none;stroke:#00A9AD;stroke-linecap:round;stroke-linejoin:round;filter:url(#paintTexture)}
      .aqua{fill:none;stroke:#61D7D6;stroke-linecap:round;stroke-linejoin:round;filter:url(#paintTexture)}
      .lightText{fill:#F4F4F1;stroke:#E1E1DC;stroke-width:2;paint-order:stroke fill;filter:url(#softShadow)}
    </style>
  </defs>

  <!-- transparent background: intentionally no rectangle/circle -->

  <!-- painted yellow arch -->
  <g opacity="0.98">
    <path class="yellow" stroke-width="50" d="M565 395 C610 145 935 102 1066 266 C1118 331 1134 385 1135 423"/>
    <path class="yellow" stroke-width="33" opacity="0.75" d="M584 392 C640 177 921 132 1047 275 C1098 333 1118 379 1121 420"/>
    <path class="yellow" stroke-width="12" opacity="0.8" d="M538 405 C574 137 940 80 1094 253 C1152 319 1169 386 1163 438"/>
    <path class="yellow" stroke-width="8" opacity="0.55" d="M605 362 C692 185 919 164 1028 291 C1064 333 1083 378 1087 420"/>
  </g>

  <!-- sun -->
  <g filter="url(#paintTexture)">
    <circle cx="772" cy="365" r="48" fill="#F7B71E" opacity="0.97"/>
    <circle cx="772" cy="365" r="37" fill="none" stroke="#FFC846" stroke-width="8" opacity="0.7"/>
    <circle cx="772" cy="365" r="22" fill="none" stroke="#EBA513" stroke-width="5" opacity="0.55"/>
  </g>

  <!-- island and palms -->
  <g stroke="#057276" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#paintTexture)">
    <path stroke-width="16" d="M388 430 C445 410 512 410 567 430"/>
    <path stroke-width="10" opacity="0.9" d="M365 442 C438 424 520 423 606 443"/>
    <path stroke-width="8" opacity="0.8" d="M405 417 C458 397 521 401 560 419"/>

    <path stroke-width="12" d="M492 414 C497 343 500 281 505 214"/>
    <path stroke-width="10" d="M454 418 C450 365 446 321 439 283"/>

    <path stroke-width="10" d="M505 220 C468 190 435 176 405 173"/>
    <path stroke-width="9" d="M503 220 C542 190 579 178 615 176"/>
    <path stroke-width="8" d="M501 223 C469 226 429 235 397 257"/>
    <path stroke-width="8" d="M504 226 C542 224 580 235 612 253"/>
    <path stroke-width="7" d="M500 219 C491 184 478 163 455 148"/>
    <path stroke-width="7" d="M507 218 C525 186 547 166 574 153"/>
    <path stroke-width="7" d="M502 230 C478 255 457 284 439 313"/>
    <path stroke-width="7" d="M508 229 C540 250 562 276 580 307"/>

    <path stroke-width="7" d="M439 287 C411 265 387 256 360 258"/>
    <path stroke-width="7" d="M439 288 C463 267 491 260 516 264"/>
    <path stroke-width="6" d="M438 291 C413 296 388 310 368 330"/>
    <path stroke-width="6" d="M441 292 C465 299 486 313 503 334"/>
  </g>

  <!-- lagoon water brush strokes -->
  <g>
    <path class="tealDark" stroke-width="14" d="M333 434 C485 426 661 430 836 430 C980 430 1117 430 1193 427"/>
    <path class="teal" stroke-width="20" opacity="0.95" d="M350 470 C490 462 650 467 807 466 C980 465 1110 462 1186 459"/>
    <path class="teal" stroke-width="13" opacity="0.88" d="M383 496 C535 492 690 500 864 495 C980 492 1068 490 1148 489"/>
    <path class="aqua" stroke-width="18" opacity="0.9" d="M436 533 C558 526 696 532 831 529 C967 526 1039 523 1109 523"/>
    <path class="aqua" stroke-width="14" opacity="0.75" d="M515 570 C628 562 739 568 844 566 C920 563 984 561 1035 561"/>
    <path class="aqua" stroke-width="11" opacity="0.56" d="M598 608 C690 602 775 606 859 604 C921 602 963 599 1002 598"/>
    <path class="teal" stroke-width="7" opacity="0.75" d="M416 452 C518 448 652 452 743 450"/>
    <path class="tealDark" stroke-width="6" opacity="0.65" d="M900 448 C1009 446 1100 443 1223 441"/>
  </g>

  <!-- decorative small strokes -->
  <path class="teal" stroke-width="10" opacity="0.9" d="M350 844 C383 841 417 841 447 844"/>
  <path class="teal" stroke-width="10" opacity="0.9" d="M1102 844 C1133 841 1166 841 1198 844"/>

  <!-- text -->
  <g text-anchor="middle">
    <text x="768" y="760" class="lightText" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" letter-spacing="22">SUEÑO</text>
    <text x="768" y="880" class="lightText" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="34">BACALAR</text>
  </g>
</svg>
