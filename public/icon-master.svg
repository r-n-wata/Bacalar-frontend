<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Sueño Bacalar SB icon</title>
  <desc id="desc">Rounded square monogram icon with SB lettering in the Sueño Bacalar color palette.</desc>
  <defs>
