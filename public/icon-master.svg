    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#03565A" flood-opacity="0.16" />
    </filter>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61D7D6" />
      <stop offset="55%" stop-color="#00A9AD" />
      <stop offset="100%" stop-color="#057276" />
